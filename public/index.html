<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domů</title>
  <style>
    body { margin: 32px; font: 16px/1.5 system-ui, sans-serif; color: #172536; background: #f5f7fa; }
    main { max-width: 440px; margin: 12vh auto 0; }
    nav { display: grid; gap: 20px; }
    nav a { display: block; padding: 28px 20px; border: 1px solid #c9d2dc; border-radius: 8px; background: white; color: #172536; text-align: center; font-size: 24px; font-weight: 600; text-decoration: none; }
    nav a[href]:hover { border-color: #345bb8; }
    nav a[aria-disabled="true"] { color: #667788; background: #edf1f6; }
    #navigation-status { color: #526171; }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Hlavní akce">
      <a id="diary-link" aria-disabled="true">Můj deník</a>
      <a id="game-link" aria-disabled="true">Vstoupit do hry</a>
    </nav>
    <p id="navigation-status" role="status">Načítám odkaz na postavu…</p>
    <noscript>Pro otevření deníku nebo hry povolte JavaScript.</noscript>
  </main>
  <script type="module" src="./navigation.js"></script>
</body>
</html>
