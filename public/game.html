<!doctype html>
<html lang="cs" class="game-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TECH-001 · Realtime spike</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a id="home-link" href="./index.html" style="color: #526171;">← Domů</a>
  <p id="navigation-status" role="status"></p>
  <div id="game-content" hidden>
  <h1>TECH-001 · Realtime spike</h1>
  <p>Přetáhněte token. Pozice se ukládá až po puštění.</p>
  <p id="connection" role="status">Realtime: připojuji…</p>
  <p id="status" role="status">Načítám konfiguraci…</p>
  <p>Pozice na mapě: <output id="position">—</output></p>
  <label for="map-select" id="map-select-label" hidden>Aktivní mapa</label>
  <select id="map-select" aria-describedby="active-map-status" hidden disabled></select>
  <p id="active-map-status" role="status">Načítám aktivní mapu…</p>
  <p id="map-status" role="status">Načítám mapu…</p>
  <p>Velikost pole: <output id="cell-size"></output> px</p>
  <p id="cell-size-status" role="status">Čekám na načtení velikosti pole z DB…</p>
  <button id="add-token" type="button" aria-describedby="add-token-message" hidden>Přidat postavu na mapu</button>
  <p id="add-token-message" role="status"></p>
  <button id="remove-token" type="button" aria-describedby="remove-token-message" hidden>Odebrat postavu z mapy</button>
  <p id="remove-token-message" role="status"></p>
  <section id="scene-players" hidden>
    <h2>Hráči ve scéně</h2>
    <ul id="scene-players-list"></ul>
  </section>
  <button id="fit-map" type="button">Přizpůsobit mapu</button>
  <section id="npc-controls" hidden>
    <h2>NPC</h2>
    <details><summary>+ Nové NPC</summary>
      <form id="npc-form">
        <label>Název <input id="npc-name" maxlength="120" required></label>
        <label>Obrázek (volitelná URL) <input id="npc-image" type="url" maxlength="2048" placeholder="https://…"></label>
        <button type="submit">Vytvořit NPC</button>
      </form>
    </details>
    <ul id="npc-list"></ul>
  </section>
  <p id="npc-status" role="status"></p>
  <div id="map-viewport" aria-label="Testovací mapa">
    <div id="map-space">
      <img id="map" alt="Aktivní mapa" draggable="false" hidden>
      <svg id="grid" xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true"></svg>
    </div>
  </div>
  </div>
  <script type="module" src="./navigation.js"></script>
</body>
</html>
