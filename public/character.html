<!doctype html>
<html lang="cs" class="character-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deník postavy</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <a id="home-link" href="./index.html">← Domů</a>
    <p id="load-status" role="status" aria-live="polite">Načítám postavu…</p>
    <section id="student-card" class="card" aria-labelledby="card-title" hidden>
      <header class="card-header">
        <div class="card-heading"><p class="card-kicker">Studijní záznam</p><h1 id="card-title">Studentský průkaz</h1></div>
        <div class="card-actions">
        <!-- Hook for the future shared supplementary information panel. -->
        <button id="supplementary-info" type="button" disabled aria-label="Doplňující info – připravujeme" title="Doplňující info – připravujeme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg>
        </button>
        <button id="edit-toggle" class="edit" type="button" aria-label="Upravit průkaz" title="Upravit průkaz" aria-pressed="false">
          <svg id="edit-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m15 5 4 4M4 20l5-1L20 8a2.8 2.8 0 0 0-4-4L5 15z"/></svg>
          <svg id="close-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" hidden><path d="m6 6 12 12M6 18 18 6"/></svg>
        </button>
        </div>
      </header>
      <!-- Reserved for future page tabs; empty while the card has only one page. -->
      <div class="card-tabs"></div>
      <div class="card-content">
      <div id="identity-page" class="card-page">
      <div class="identity">
        <div class="portrait">
          <svg id="portrait-placeholder" width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="Portrét není k dispozici"><circle cx="32" cy="22" r="10"/><path d="M12 54c0-13 9-19 20-19s20 6 20 19"/></svg>
          <img id="portrait" alt="Portrét postavy" referrerpolicy="no-referrer" hidden>
        </div>
        <dl>
          <div class="name"><dt><label for="edit-name">Jméno</label></dt><dd><span id="character-name"></span><input id="edit-name" type="text" required aria-describedby="error-name" hidden><span id="error-name" class="field-error" role="status"></span></dd></div>
          <div><dt><label for="edit-race">Rasa</label></dt><dd><span id="character-race"></span><select id="edit-race" aria-describedby="error-race" hidden></select><span id="error-race" class="field-error" role="status"></span></dd></div>
          <div><dt><label for="edit-class">Povolání</label></dt><dd><span id="character-class"></span><select id="edit-class" aria-describedby="error-class" hidden></select><span id="error-class" class="field-error" role="status"></span></dd></div>
          <div><dt><label for="edit-level">Level</label></dt><dd><span id="character-level"></span><input id="edit-level" type="number" min="1" max="20" step="1" aria-describedby="error-level" hidden><span id="error-level" class="field-error" role="status"></span></dd></div>
          <div><dt><label for="edit-xp">XP</label></dt><dd><span id="character-xp"></span><input id="edit-xp" type="number" min="0" step="1" aria-describedby="error-xp" hidden><span id="error-xp" class="field-error" role="status"></span><span id="xp-next" class="hint"></span></dd></div>
          <div class="hp-block"><dt>HP</dt><dd>
            <div class="hp-values"><span id="character-current_hp"></span><input id="edit-current_hp" aria-label="Aktuální HP" type="number" min="0" step="1" aria-describedby="error-current_hp" hidden><span>/</span><span id="character-max_hp"></span><input id="edit-max_hp" aria-label="Maximální HP" type="number" min="1" step="1" aria-describedby="error-max_hp" hidden></div>
            <span id="error-current_hp" class="field-error" role="status"></span><span id="error-max_hp" class="field-error" role="status"></span>
            <div class="hp-adjust"><button id="hp-minus" type="button" aria-label="Odečíst HP" aria-describedby="hp-hint">−</button><input id="hp-delta" type="number" min="1" step="1" value="1" aria-label="Počet HP k přidání nebo odečtení" aria-describedby="hp-hint hp-error"><button id="hp-plus" type="button" aria-label="Přidat HP" aria-describedby="hp-hint">+</button></div><span id="hp-hint" class="hint"></span><span id="hp-error" class="field-error" role="status"></span>
          </dd></div>
        </dl>
      </div>
      </div>
      </div>
      <p id="save-status" role="status" aria-live="polite"></p>
    </section>
    <section id="abilities" class="abilities" aria-label="Vlastnosti" hidden>
      <article class="ability-card">
        <h2><svg class="ability-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h3v8H5zM16 8h3v8h-3zM8 12h8M2 10v4M22 10v4"/></svg><label for="edit-str">Síla (STR)</label></h2>
        <div class="ability-values"><input id="edit-str" type="number" min="1" max="20" step="1" aria-describedby="error-str"><div class="ability-derived"><p>Modifikátor: <output id="modifier-str" for="edit-str" aria-label="Modifikátor: Síla"></output></p><p>Záchrana: <output id="save-str" for="edit-str" aria-label="Záchrana STR"></output> <span id="save-proficiency-str" class="save-proficiency" role="img" aria-label="Zdatnost v záchranném hodu" hidden>●</span></p></div></div>
        <span id="error-str" class="field-error" role="status"></span>
      </article>
      <article class="ability-card">
        <h2><svg class="ability-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18 19 5M11 5h8v8M3 7h5M3 11h3"/></svg><label for="edit-dex">Obratnost (DEX)</label></h2>
        <div class="ability-values"><input id="edit-dex" type="number" min="1" max="20" step="1" aria-describedby="error-dex"><div class="ability-derived"><p>Modifikátor: <output id="modifier-dex" for="edit-dex" aria-label="Modifikátor: Obratnost"></output></p><p>Záchrana: <output id="save-dex" for="edit-dex" aria-label="Záchrana DEX"></output> <span id="save-proficiency-dex" class="save-proficiency" role="img" aria-label="Zdatnost v záchranném hodu" hidden>●</span></p></div></div>
        <span id="error-dex" class="field-error" role="status"></span>
      </article>
      <article class="ability-card">
        <h2><svg class="ability-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6zM12 7v10"/></svg><label for="edit-con">Odolnost (CON)</label></h2>
        <div class="ability-values"><input id="edit-con" type="number" min="1" max="20" step="1" aria-describedby="error-con"><div class="ability-derived"><p>Modifikátor: <output id="modifier-con" for="edit-con" aria-label="Modifikátor: Odolnost"></output></p><p>Záchrana: <output id="save-con" for="edit-con" aria-label="Záchrana CON"></output> <span id="save-proficiency-con" class="save-proficiency" role="img" aria-label="Zdatnost v záchranném hodu" hidden>●</span></p></div></div>
        <span id="error-con" class="field-error" role="status"></span>
      </article>
      <article class="ability-card">
        <h2><svg class="ability-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1zM12 6v14"/></svg><label for="edit-int">Inteligence (INT)</label></h2>
        <div class="ability-values"><input id="edit-int" type="number" min="1" max="20" step="1" aria-describedby="error-int"><div class="ability-derived"><p>Modifikátor: <output id="modifier-int" for="edit-int" aria-label="Modifikátor: Inteligence"></output></p><p>Záchrana: <output id="save-int" for="edit-int" aria-label="Záchrana INT"></output> <span id="save-proficiency-int" class="save-proficiency" role="img" aria-label="Zdatnost v záchranném hodu" hidden>●</span></p></div></div>
        <span id="error-int" class="field-error" role="status"></span>
      </article>
      <article class="ability-card">
        <h2><svg class="ability-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><label for="edit-wis">Moudrost (WIS)</label></h2>
        <div class="ability-values"><input id="edit-wis" type="number" min="1" max="20" step="1" aria-describedby="error-wis"><div class="ability-derived"><p>Modifikátor: <output id="modifier-wis" for="edit-wis" aria-label="Modifikátor: Moudrost"></output></p><p>Záchrana: <output id="save-wis" for="edit-wis" aria-label="Záchrana WIS"></output> <span id="save-proficiency-wis" class="save-proficiency" role="img" aria-label="Zdatnost v záchranném hodu" hidden>●</span></p></div></div>
        <span id="error-wis" class="field-error" role="status"></span>
      </article>
      <article class="ability-card">
        <h2><svg class="ability-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-8l-6 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM7 9h10M7 13h7"/></svg><label for="edit-cha">Charisma (CHA)</label></h2>
        <div class="ability-values"><input id="edit-cha" type="number" min="1" max="20" step="1" aria-describedby="error-cha"><div class="ability-derived"><p>Modifikátor: <output id="modifier-cha" for="edit-cha" aria-label="Modifikátor: Charisma"></output></p><p>Záchrana: <output id="save-cha" for="edit-cha" aria-label="Záchrana CHA"></output> <span id="save-proficiency-cha" class="save-proficiency" role="img" aria-label="Zdatnost v záchranném hodu" hidden>●</span></p></div></div>
        <span id="error-cha" class="field-error" role="status"></span>
      </article>
    </section>
    <noscript>Pro zobrazení deníku povolte JavaScript.</noscript>
  </main>
  <script type="module" src="./character-page.js"></script>
  <script type="module" src="./navigation.js"></script>
</body>
</html>
